apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-inspector-alert-bridge
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: bridge
          env:
            - name: BRIDGE_DELIVERY_MODE
              value: async
            - name: BRIDGE_STATE_DB
              value: /var/lib/inspector/bridge.db
            - name: BRIDGE_SOURCES_FILE
              value: /etc/bridge-auth/sources.json
          volumeMounts:
            - name: bridge-state
              mountPath: /var/lib/inspector
            - name: bridge-auth
              mountPath: /etc/bridge-auth
              readOnly: true
      volumes:
        - name: bridge-state
          persistentVolumeClaim:
            claimName: k8s-inspector-bridge-state
        - name: bridge-auth
          secret:
            secretName: inspector-bridge-auth
            defaultMode: 0440
