# Matches the current base receiver/inhibition policy; C5/E2 must keep this
# effective config in sync with any later centralized routing changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-inspector-alertmanager-config
  namespace: kube-system
data:
  alertmanager.yml: |
    route:
      receiver: feishu-bridge
      group_by: ["cluster"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
    inhibit_rules:
      - source_matchers:
          - alertname="K8sInspectorStale"
        target_matchers:
          - alertname=~"K8sInspectorHasFail|K8sInspectorHasWarn|K8sInspectorCheckFail|K8sInspectorPendingPVC"
        equal: ["cluster", "profile"]
    receivers:
      - name: feishu-bridge
        webhook_configs:
          - url: http://k8s-inspector-alert-bridge.kube-system.svc:8000/alert
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/bridge-auth/token
