apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-inspector-alert-bridge
  namespace: kube-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: k8s-inspector-alert-bridge
  template:
    metadata:
      labels:
        app: k8s-inspector-alert-bridge
    spec:
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      containers:
      - name: bridge
        image: your-registry/k8s-inspector:0.1.0
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - k8s_inspector.alertmanager_bridge
        env:
        - name: FEISHU_MODE
          value: app
        - name: FEISHU_CHAT_POLICY
          value: fixed
        - name: FEISHU_CHAT_ID
          valueFrom:
            secretKeyRef:
              name: k8s-inspector-feishu
              key: fixed_chat_id
        - name: FEISHU_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: k8s-inspector-feishu
              key: feishu_webhook
              optional: true
        - name: FEISHU_APP_ID
          valueFrom:
            secretKeyRef:
              name: k8s-inspector-feishu
              key: app_id
        - name: FEISHU_APP_SECRET
          valueFrom:
            secretKeyRef:
              name: k8s-inspector-feishu
              key: app_secret
        - name: INSPECTOR_REPORT_DIR
          value: /data/out
        - name: INSPECTOR_REPORT_MAX_RESULTS
          value: '5'
        - name: INSPECTOR_REPORT_MAX_ITEMS
          value: '3'
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: HOME
          value: /tmp
        ports:
        - name: http
          containerPort: 8000
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: out
          mountPath: /data/out
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          failureThreshold: 30
          periodSeconds: 2
      volumes:
      - name: out
        persistentVolumeClaim:
          claimName: k8s-inspector-out
      - name: tmp
        emptyDir:
          sizeLimit: 16Mi
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-inspector-alert-bridge
  namespace: kube-system
spec:
  selector:
    app: k8s-inspector-alert-bridge
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: k8s-inspector-alert-bridge
  namespace: kube-system
spec:
  podSelector:
    matchLabels:
      app: k8s-inspector-alert-bridge
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: alertmanager
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000
