apiVersion: v1
kind: Secret
metadata:
  name: k8s-inspector-feishu
  namespace: kube-system
type: Opaque
stringData:
  # app 模式必须：企业自建应用
  app_id: "YOUR_APP_ID"
  app_secret: "YOUR_APP_SECRET"
  # app 模式必须：预先建立的固定责任群 chat_id；应用机器人需已加入该群
  fixed_chat_id: "YOUR_FIXED_CHAT_ID"
  # webhook 模式可选：群自定义机器人 webhook（仅推送固定群）
  feishu_webhook: ""
