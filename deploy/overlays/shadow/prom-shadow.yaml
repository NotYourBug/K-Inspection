apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-inspector-prometheus-config
  namespace: kube-system
data:
  prometheus.yml: "global:\n  scrape_interval: 15s\n  evaluation_interval: 15s\nrule_files:\n\
    - /etc/prometheus/rules/*.yaml\nalerting:\n  alertmanagers:\n  - static_configs:\n\
    \    - targets:\n      - alertmanager:9093\nscrape_configs:\n- job_name: prometheus\n\
    \  static_configs:\n  - targets:\n    - 127.0.0.1:9090\n- job_name: pushgateway\n\
    \  honor_labels: true\n  static_configs:\n  - targets:\n    - pushgateway:9091\n\
    - job_name: inspector-inventory\n  static_configs:\n  - targets:\n    - k8s-inspector-inventory:9400\n"
