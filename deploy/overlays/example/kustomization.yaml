apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
components:
- ../../components/bridge
- ../../components/bridge-async
- ../../components/monitoring
- ../../components/monitoring-bridge-auth
patches:
- target:
    kind: PersistentVolumeClaim
    labelSelector: inspector.storage=state
  patch: "- op: replace\n  path: /spec/storageClassName\n  value: replace-with-verified-block-sc"
configMapGenerator:
- name: k8s-inspector-runtime
  namespace: kube-system
  behavior: merge
  literals:
  - INSPECTOR_CLUSTER=example-cluster
  - PUSHGATEWAY_URL=http://pushgateway:9091
  - PUSHGATEWAY_JOB=k8s-inspector-example
