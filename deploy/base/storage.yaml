apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8s-inspector-out
  namespace: kube-system
  labels:
    inspector.storage: report
spec:
  accessModes:
  - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: replace-with-report-sc
  resources:
    requests:
      storage: 10Gi
---
