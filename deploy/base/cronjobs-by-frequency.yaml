apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-inspector-dataplane-5m
  namespace: kube-system
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: k8s-inspector
          restartPolicy: Never
          containers:
          - name: inspector
            image: your-registry/k8s-inspector:0.1.0
            imagePullPolicy: IfNotPresent
            args:
            - run
            - --in-cluster
            - --profile
            - 5m
            - --formats
            - json
            - --output-dir
            - /data/out/latest/5m
            - --persist-level
            - issue
            env:
            - name: INSPECTOR_STATE_DIR
              value: /var/lib/inspector
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            volumeMounts:
            - name: out
              mountPath: /data/out
            - name: state
              mountPath: /var/lib/inspector
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 1000m
                memory: 512Mi
            envFrom:
            - configMapRef:
                name: k8s-inspector-runtime
          volumes:
          - name: out
            persistentVolumeClaim:
              claimName: k8s-inspector-out
          - name: state
            persistentVolumeClaim:
              claimName: k8s-inspector-state-5m
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 30
      activeDeadlineSeconds: 270
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
  suspend: true
  timeZone: Asia/Shanghai
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
