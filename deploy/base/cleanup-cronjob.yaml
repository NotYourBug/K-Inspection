apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-inspector-cleanup
  namespace: kube-system
spec:
  schedule: 30 3 * * *
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: k8s-inspector
          restartPolicy: Never
          containers:
          - name: cleanup
            image: your-registry/k8s-inspector:0.1.0
            imagePullPolicy: IfNotPresent
            args:
            - cleanup
            - --root
            - /data/out/archive
            - --hourly-days
            - '7'
            - --daily-days
            - '30'
            env:
            - name: INSPECTOR_EXIT_MODE
              value: always0
            volumeMounts:
            - name: out
              mountPath: /data/out
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi
          volumes:
          - name: out
            persistentVolumeClaim:
              claimName: k8s-inspector-out
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
  suspend: true
