  namespace: k8s-inspector-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        image: prom/alertmanager:v0.27.0
        name: alertmanager
        ports:
        - containerPort: 9093
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/bridge-auth
          name: bridge-auth
          readOnly: true
        - mountPath: /etc/alertmanager/alertmanager.yml
          name: config
          subPath: alertmanager.yml
        - mountPath: /alertmanager
          name: data
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
      - name: bridge-auth
        secret:
          defaultMode: 288
          secretName: inspector-shadow-bridge-auth
      - configMap:
          name: k8s-inspector-alertmanager-config
        name: config
      - name: data
        persistentVolumeClaim:
          claimName: k8s-inspector-alertmanager-data
