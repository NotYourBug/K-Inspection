apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-inspector-alert-bridge
  namespace: k8s-inspector-shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-inspector-alert-bridge
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: k8s-inspector-alert-bridge
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - -m
        - k8s_inspector.alertmanager_bridge
        env:
        - name: FEISHU_MODE
          value: app
        - name: FEISHU_CHAT_POLICY
          value: fixed
        - name: FEISHU_CHAT_ID
          valueFrom:
            secretKeyRef:
              key: fixed_chat_id
              name: k8s-inspector-shadow-feishu
        - name: FEISHU_WEBHOOK
          valueFrom:
            secretKeyRef:
              key: feishu_webhook
              name: k8s-inspector-shadow-feishu
              optional: true
        - name: FEISHU_APP_ID
          valueFrom:
            secretKeyRef:
              key: app_id
              name: k8s-inspector-shadow-feishu
        - name: FEISHU_APP_SECRET
          valueFrom:
            secretKeyRef:
              key: app_secret
              name: k8s-inspector-shadow-feishu
        - name: INSPECTOR_REPORT_DIR
          value: /data/shadow
        - name: INSPECTOR_REPORT_MAX_RESULTS
          value: "5"
        - name: INSPECTOR_REPORT_MAX_ITEMS
          value: "3"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: HOME
          value: /tmp
        - name: BRIDGE_DELIVERY_MODE
          value: async
        - name: BRIDGE_STATE_DB
          value: /var/lib/inspector/bridge.db
        - name: BRIDGE_SOURCES_FILE
          value: /etc/bridge-auth/sources.json
        image: your-registry/k8s-inspector:0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
        name: bridge
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /data/shadow
          name: out
          readOnly: true
        - mountPath: /var/lib/inspector
          name: bridge-state
        - mountPath: /etc/bridge-auth
          name: bridge-auth
          readOnly: true
        - mountPath: /data/out
          name: out
          readOnly: true
        - mountPath: /tmp
          name: tmp
      restartPolicy: Always
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: bridge-auth
        secret:
          defaultMode: 288
          secretName: inspector-shadow-bridge-auth
      - name: bridge-state
        persistentVolumeClaim:
          claimName: k8s-inspector-bridge-state
      - name: out
        persistentVolumeClaim:
          claimName: k8s-inspector-out
      - emptyDir:
          sizeLimit: 16Mi
        name: tmp
