apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        image: prom/alertmanager:v0.27.0
        name: alertmanager
        ports:
        - containerPort: 9093
          name: http
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/bridge-auth
          name: bridge-auth
          readOnly: true
        - mountPath: /etc/alertmanager/alertmanager.yml
          name: config
          subPath: alertmanager.yml
        - mountPath: /alertmanager
          name: data
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
      volumes:
      - name: bridge-auth
        secret:
          defaultMode: 288
          secretName: inspector-bridge-auth
      - configMap:
          name: k8s-inspector-alertmanager-config
        name: config
      - name: data
        persistentVolumeClaim:
          claimName: k8s-inspector-alertmanager-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-inspector-alert-bridge
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-inspector-alert-bridge
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: k8s-inspector-alert-bridge
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - python
        - -m
        - k8s_inspector.alertmanager_bridge
        env:
        - name: BRIDGE_DELIVERY_MODE
          value: async
        - name: BRIDGE_STATE_DB
          value: /var/lib/inspector/bridge.db
        - name: BRIDGE_SOURCES_FILE
          value: /etc/bridge-auth/sources.json
        - name: FEISHU_MODE
          value: app
        - name: FEISHU_CHAT_POLICY
          value: fixed
        - name: FEISHU_CHAT_ID
          valueFrom:
            secretKeyRef:
              key: fixed_chat_id
              name: k8s-inspector-feishu
        - name: FEISHU_WEBHOOK
          valueFrom:
            secretKeyRef:
              key: feishu_webhook
              name: k8s-inspector-feishu
              optional: true
        - name: FEISHU_APP_ID
          valueFrom:
            secretKeyRef:
              key: app_id
              name: k8s-inspector-feishu
        - name: FEISHU_APP_SECRET
          valueFrom:
            secretKeyRef:
              key: app_secret
              name: k8s-inspector-feishu
        - name: INSPECTOR_REPORT_DIR
          value: /data/out
        - name: INSPECTOR_REPORT_MAX_RESULTS
          value: "5"
        - name: INSPECTOR_REPORT_MAX_ITEMS
          value: "3"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: HOME
          value: /tmp
        image: your-registry/k8s-inspector:0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
        name: bridge
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
        volumeMounts:
        - mountPath: /var/lib/inspector
          name: bridge-state
        - mountPath: /etc/bridge-auth
          name: bridge-auth
          readOnly: true
        - mountPath: /data/out
          name: out
          readOnly: true
        - mountPath: /tmp
          name: tmp
      restartPolicy: Always
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: bridge-state
        persistentVolumeClaim:
          claimName: k8s-inspector-bridge-state
      - name: bridge-auth
        secret:
          defaultMode: 288
          secretName: inspector-bridge-auth
      - name: out
        persistentVolumeClaim:
          claimName: k8s-inspector-out
      - emptyDir:
          sizeLimit: 16Mi
        name: tmp
