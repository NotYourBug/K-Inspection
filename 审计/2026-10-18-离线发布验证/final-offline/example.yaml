apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-inspector
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-inspector-addon-observer
  namespace: kube-system
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-inspector
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  - events
  - persistentvolumeclaims
  verbs:
  - get
  - list
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
- apiGroups:
  - metrics.k8s.io
  resources:
  - nodes
  verbs:
  - get
  - list
- nonResourceURLs:
  - /healthz
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-inspector-addon-observer
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-inspector-addon-observer
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-inspector
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: kube-system
---
apiVersion: v1
data:
  alertmanager.yml: |
    route:
      receiver: feishu-bridge
      group_by: ["cluster"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
    inhibit_rules:
      - source_matchers:
          - alertname="K8sInspectorStale"
        target_matchers:
          - alertname=~"K8sInspectorHasFail|K8sInspectorHasWarn|K8sInspectorCheckFail|K8sInspectorPendingPVC"
        equal: ["cluster", "profile"]
    receivers:
      - name: feishu-bridge
        webhook_configs:
          - url: http://k8s-inspector-alert-bridge:8000/alert
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/bridge-auth/token
kind: ConfigMap
metadata:
  name: k8s-inspector-alertmanager-config
  namespace: kube-system
---
apiVersion: v1
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager:9093

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["127.0.0.1:9090"]

      - job_name: pushgateway
        honor_labels: true
        static_configs:
          - targets: ["pushgateway:9091"]
