apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-inspector-cleanup
  namespace: kube-system
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 930
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - cleanup
            - --root
            - /data/out/archive
            - --hourly-days
            - "7"
            - --daily-days
            - "30"
            - --dry-run
            env:
            - name: INSPECTOR_EXIT_MODE
              value: always0
            image: your-registry/k8s-inspector:0.1.0
            imagePullPolicy: IfNotPresent
            name: cleanup
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /data/out
              name: out
          restartPolicy: Never
          securityContext:
            fsGroup: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: k8s-inspector
          volumes:
          - name: out
            persistentVolumeClaim:
              claimName: k8s-inspector-out
  schedule: 30 3 * * *
  suspend: true
  timeZone: Asia/Shanghai
