apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-inspector
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-inspector-addon-observer
  namespace: kube-system
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-inspector
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - pods
  - events
  - persistentvolumeclaims
  verbs:
  - get
  - list
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs:
  - get
  - list
- apiGroups:
  - metrics.k8s.io
  resources:
  - nodes
  verbs:
  - get
  - list
- nonResourceURLs:
  - /healthz
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-inspector-addon-observer
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-inspector-addon-observer
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-inspector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-inspector
subjects:
- kind: ServiceAccount
  name: k8s-inspector
  namespace: kube-system
---
apiVersion: v1
data:
  INSPECTOR_CLUSTER: replace-with-cluster-id
  INSPECTOR_EXIT_MODE: always0
  PUSHGATEWAY_JOB: k8s-inspector
  PUSHGATEWAY_URL: ""
kind: ConfigMap
metadata:
  name: k8s-inspector-runtime-cbb9t87768
  namespace: kube-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    inspector.storage: report
  name: k8s-inspector-out
  namespace: kube-system
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: replace-with-report-sc
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    inspector.storage: state
  name: k8s-inspector-state-10m
  namespace: kube-system
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: replace-with-verified-block-sc
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    inspector.storage: state
  name: k8s-inspector-state-5m
  namespace: kube-system
spec:
  accessModes:
