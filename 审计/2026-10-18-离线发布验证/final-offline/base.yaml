  storageClassName: replace-with-verified-block-sc
  volumeMode: Filesystem
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-inspector-cleanup
  namespace: kube-system
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 930
      backoffLimit: 0
      template:
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - cleanup
            - --root
            - /data/out/archive
            - --hourly-days
            - "7"
            - --daily-days
            - "30"
            - --dry-run
            env:
            - name: INSPECTOR_EXIT_MODE
              value: always0
            image: your-registry/k8s-inspector:0.1.0
            imagePullPolicy: IfNotPresent
            name: cleanup
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 10m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /data/out
              name: out
          restartPolicy: Never
          securityContext:
            fsGroup: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: k8s-inspector
          volumes:
          - name: out
            persistentVolumeClaim:
              claimName: k8s-inspector-out
  schedule: 30 3 * * *
  suspend: true
  timeZone: Asia/Shanghai
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-inspector-controlplane-10m
  namespace: kube-system
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 510
      backoffLimit: 0
      template:
        spec:
          containers:
          - args:
            - run
            - --in-cluster
            - --profile
            - 10m
            - --formats
            - json
            - --output-dir
            - /data/out/latest/10m
            - --persist-level
            - issue
            env:
            - name: INSPECTOR_STATE_DIR
              value: /var/lib/inspector
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            envFrom:
            - configMapRef:
                name: k8s-inspector-runtime-cbb9t87768
            image: your-registry/k8s-inspector:0.1.0
            imagePullPolicy: IfNotPresent
            name: inspector
            resources:
              limits:
                cpu: 1000m
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /data/out
              name: out
            - mountPath: /var/lib/inspector
              name: state
          restartPolicy: Never
          securityContext:
            fsGroup: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: k8s-inspector
          terminationGracePeriodSeconds: 30
          volumes:
          - name: out
            persistentVolumeClaim:
              claimName: k8s-inspector-out
          - name: state
            persistentVolumeClaim:
              claimName: k8s-inspector-state-10m
      ttlSecondsAfterFinished: 86400
  schedule: '*/10 * * * *'
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 2
  suspend: true
  timeZone: Asia/Shanghai
