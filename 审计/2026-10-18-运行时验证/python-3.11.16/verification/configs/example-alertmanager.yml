inhibit_rules:
- equal:
  - cluster
  - profile
  source_matchers:
  - alertname="K8sInspectorStale"
  target_matchers:
  - alertname=~"K8sInspectorHasFail|K8sInspectorHasWarn|K8sInspectorCheckFail|K8sInspectorPendingPVC"
receivers:
- name: feishu-bridge
  webhook_configs:
  - http_config:
      authorization:
        credentials_file: C:\Users\23033\Desktop\Cluster-Stability-Inspector\out\ra\w31116\configs\validation-token
        type: Bearer
    send_resolved: true
    url: http://k8s-inspector-alert-bridge:8000/alert
route:
  group_by:
  - cluster
  group_interval: 5m
  group_wait: 30s
  receiver: feishu-bridge
  repeat_interval: 2h
