[build-system]
requires = ["setuptools>=68,<85", "wheel>=0.45,<0.49"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-inspector"
version = "0.1.0"
description = "Kubernetes cluster inspection tool for SRE"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "kubernetes>=29.0.0,<38",
  "PyYAML>=6.0.1,<7",
  "prometheus-client>=0.20.0,<1",
  "lark-oapi==1.7.5",
]

[project.scripts]
k8s-inspector = "k8s_inspector.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8.4,<10", "tomli>=2; python_version<'3.11'"]

[tool.setuptools.packages.find]
include = ["k8s_inspector", "k8s_inspector.*"]
namespaces = false
